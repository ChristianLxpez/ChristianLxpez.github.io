<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Plan — Servicio de Contenido con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e6e0;
    --muted: #6e6c68;
    --muted2: #9e9c97;
    --p1: #a89cf7;
    --p1bg: rgba(168,156,247,0.1);
    --p2: #4ecb9a;
    --p2bg: rgba(78,203,154,0.1);
    --p3: #f0a855;
    --p3bg: rgba(240,168,85,0.1);
    --p4: #f07060;
    --p4bg: rgba(240,112,96,0.1);
    --done: #4ecb9a;
    --donebg: rgba(78,203,154,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 3rem 2rem 2rem;
    max-width: 860px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border);
  }
  .header-eyebrow {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  h1 em {
    font-style: italic;
    color: var(--p1);
  }
  .header-sub {
    color: var(--muted2);
    font-size: 12px;
    margin-bottom: 2rem;
  }

  /* GLOBAL PROGRESS */
  .global-progress {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .global-track {
    flex: 1;
    height: 2px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
  }
  .global-fill {
    height: 100%;
    background: var(--done);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }
  .global-pct {
    font-size: 11px;
    color: var(--muted2);
    white-space: nowrap;
    min-width: 80px;
    text-align: right;
  }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* PHASE */
  .phase {
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .phase.complete { border-color: rgba(78,203,154,0.3); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 1rem 1.25rem;
    cursor: pointer;
    background: var(--surface);
    user-select: none;
    transition: background 0.15s;
  }
  .phase-header:hover { background: var(--surface2); }

  .phase-num {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    min-width: 16px;
  }
  .phase-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .phase-title-wrap { flex: 1; }
  .phase-name {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 1.1rem;
    color: var(--text);
    line-height: 1.2;
  }
  .phase-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .phase-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .phase-count {
    font-size: 11px;
    color: var(--muted2);
    white-space: nowrap;
  }
  .phase-chevron {
    font-size: 10px;
    color: var(--muted);
    transition: transform 0.25s ease;
  }
  .phase-chevron.open { transform: rotate(180deg); }

  /* phase mini bar */
  .phase-bar {
    height: 1px;
    background: var(--border);
  }
  .phase-bar-fill {
    height: 100%;
    transition: width 0.4s ease;
  }

  /* TASKS */
  .tasks { display: block; }
  .tasks.collapsed { display: none; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 0.85rem 1.25rem;
    border-top: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
    background: var(--bg);
  }
  .task:hover { background: var(--surface); }
  .task.done { background: var(--donebg); }
  .task.done:hover { background: rgba(78,203,154,0.12); }

  .cb {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    border: 1px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: background 0.15s, border-color 0.15s;
  }
  .task.done .cb {
    background: var(--done);
    border-color: var(--done);
  }
  .cb svg { opacity: 0; transition: opacity 0.15s; }
  .task.done .cb svg { opacity: 1; }

  .task-body { flex: 1; }
  .task-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    transition: color 0.15s;
  }
  .task.done .task-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--muted);
  }
  .task-day {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* BADGE done */
  .done-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--donebg);
    color: var(--done);
    border: 1px solid rgba(78,203,154,0.25);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
    margin-top: 1px;
  }
  .task.done .done-badge { opacity: 1; }

  /* FOOTER */
  footer {
    max-width: 860px;
    margin: 3rem auto 2rem;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 1.5rem;
    color: var(--muted);
    font-size: 11px;
  }
  .reset-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .reset-btn:hover { border-color: var(--border2); color: var(--text); }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    pointer-events: none;
    animation: confetti-fall 1.2s ease-in forwards;
    z-index: 9999;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* scroll reveal */
  .phase { animation: fadeUp 0.4s ease both; }
  .phase:nth-child(1) { animation-delay: 0.05s; }
  .phase:nth-child(2) { animation-delay: 0.1s; }
  .phase:nth-child(3) { animation-delay: 0.15s; }
  .phase:nth-child(4) { animation-delay: 0.2s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    header, main { padding: 1.5rem 1rem; }
    h1 { font-size: 1.8rem; }
    footer { flex-direction: column; gap: 1rem; align-items: flex-start; padding: 1.5rem 1rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <p class="header-eyebrow">Proyecto 01 — Berlín</p>
  <h1>Servicio de contenido<br><em>automatizado con IA</em></h1>
  <p class="header-sub">4 fases · 28 tareas · ~6 semanas a 2h/día</p>
  <div class="global-progress">
    <div class="global-track"><div class="global-fill" id="gfill"></div></div>
    <div class="global-pct" id="gpct">0 / 28 — 0%</div>
  </div>
</header>

<main id="main"></main>

<footer>
  <span id="footer-msg">Haz clic en cada tarea para marcarla como hecha.</span>
  <button class="reset-btn" onclick="resetAll()">Reiniciar progreso</button>
</footer>

<script>
const PHASES = [
  {
    id: 'p1', color: '#a89cf7', bg: 'rgba(168,156,247,0.15)',
    name: 'Aprender las herramientas',
    meta: '10 días · 2h/día · Make.com + Claude API + Canva + Buffer',
    tasks: [
      { text: 'Crear cuenta gratuita en Make.com', day: 'Día 1' },
      { text: 'Ver tutorial introductorio de Make (60 min) en YouTube — busca "Make.com tutorial español"', day: 'Día 1–2' },
      { text: 'Crear tu primer escenario en Make: conectar Gmail con Google Sheets', day: 'Día 2–3' },
      { text: 'Entender qué es una API key y obtener la de Claude en console.anthropic.com', day: 'Día 4' },
      { text: 'Conectar Claude API en Make: enviar un prompt y recibir la respuesta', day: 'Día 5' },
      { text: 'Explorar Canva: crear una plantilla de post reutilizable (1080×1080)', day: 'Día 6–7' },
      { text: 'Crear cuenta en Buffer o Later y conectarla con Make', day: 'Día 8' },
      { text: 'Mini flujo completo: prompt → Claude genera texto → guardar en Google Sheets', day: 'Día 9–10' },
    ]
  },
  {
    id: 'p2', color: '#4ecb9a', bg: 'rgba(78,203,154,0.15)',
    name: 'Construir el sistema',
    meta: '8 días · 2h/día · Flujo automatizado completo',
    tasks: [
      { text: 'Crear la plantilla de "brand brief" (documento de onboarding del cliente)', day: 'Día 11' },
      { text: 'Escribir el prompt maestro que genera posts a partir del brand brief', day: 'Día 12' },
      { text: 'Construir el flujo completo en Make: temas → Claude → texto del post', day: 'Día 13–14' },
      { text: 'Añadir imagen al flujo: Canva o imagen de stock automática por post', day: 'Día 15' },
      { text: 'Configurar entrega al cliente: carpeta en Google Drive organizada por semana', day: 'Día 16' },
      { text: 'Probar el sistema completo de inicio a fin con datos de prueba', day: 'Día 17' },
      { text: 'Ajustar el flujo según errores encontrados en la prueba', day: 'Día 18' },
    ]
  },
  {
    id: 'p3', color: '#f0a855', bg: 'rgba(240,168,85,0.15)',
    name: 'Practicar con casos reales',
    meta: '8 días · 2h/día · 3 casos simulados para portfolio',
    tasks: [
      { text: 'Caso 1: restaurante italiano en Berlín — generar 1 mes de posts completos', day: 'Día 19–21' },
      { text: 'Caso 2: coach de fitness — generar 1 mes de posts completos', day: 'Día 22–24' },
      { text: 'Caso 3: tienda de ropa independiente — generar 1 mes de posts completos', day: 'Día 25–26' },
      { text: 'Organizar los 3 casos en un portfolio visual (Notion o PDF)', day: 'Día 27–28' },
    ]
  },
  {
    id: 'p4', color: '#f07060', bg: 'rgba(240,112,96,0.15)',
    name: 'Definir oferta y conseguir clientes',
    meta: '4 días + acción continua · Primer cliente en Berlín',
    tasks: [
      { text: 'Definir el paquete: qué incluye, qué no incluye, precio mensual', day: 'Día 29' },
      { text: 'Crear una página de presentación simple (Notion o web de una página)', day: 'Día 30' },
      { text: 'Recopilar lista de 100 negocios potenciales en Berlín', day: 'Día 31' },
      { text: 'Escribir el mensaje de contacto inicial (email o Instagram DM)', day: 'Día 32' },
      { text: 'Enviar los primeros 20 mensajes y registrar respuestas en una hoja', day: 'Día 33' },
      { text: 'Hacer seguimiento y cerrar el primer cliente', day: 'Día 34+' },
      { text: 'Ejecutar el primer mes de servicio y pedir testimonio al cliente', day: 'Día 35–65' },
                  { text: 'Usar el testimonio para conseguir el segundo cliente', day: 'Día 66+' },
                  { text: 'Escalar: repetir outreach con lista de siguientes 80 contactos', day: 'Día 70+' },
    ]
  }
];

const STORAGE_KEY = 'planIA_berlin_v2';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();
PHASES.forEach(p => {
  if (!state[p.id]) state[p.id] = new Array(p.tasks.length).fill(false);
});

function totalTasks() { return PHASES.reduce((a,p) => a + p.tasks.length, 0); }
function doneTasks() { return PHASES.reduce((a,p) => a + state[p.id].filter(Boolean).length, 0); }
function phaseDone(id) { return state[id].filter(Boolean).length; }

function updateGlobal() {
  const total = totalTasks(), done = doneTasks();
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('gfill').style.width = pct + '%';
  document.getElementById('gpct').textContent = done + ' / ' + total + ' — ' + pct + '%';
  const msg = done === 0 ? 'Haz clic en cada tarea para marcarla como hecha.'
    : done === total ? '¡Plan completado! Eres un crack.'
    : done + ' de ' + total + ' tareas completadas. Sigue así.';
  document.getElementById('footer-msg').textContent = msg;
}

function updatePhase(id) {
  const p = PHASES.find(x => x.id === id);
  const done = phaseDone(id);
  const total = p.tasks.length;
  const pct = Math.round(done / total * 100);
  const bar = document.getElementById('bar-' + id);
  if (bar) bar.style.width = pct + '%';
  const count = document.getElementById('count-' + id);
  if (count) count.textContent = done + '/' + total;
  const phaseEl = document.getElementById('phase-' + id);
  if (phaseEl) phaseEl.classList.toggle('complete', done === total);
}

function toggleTask(phaseId, idx) {
  const wasNot = !state[phaseId][idx];
  state[phaseId][idx] = wasNot;
  saveState(state);
  const taskEl = document.getElementById('task-' + phaseId + '-' + idx);
  taskEl.classList.toggle('done', state[phaseId][idx]);
  updatePhase(phaseId);
  updateGlobal();
  if (wasNot) spawnConfetti(taskEl, PHASES.find(p => p.id === phaseId).color);
}

function togglePhase(id) {
  const tasks = document.getElementById('tasks-' + id);
  const chev = document.getElementById('chev-' + id);
  const open = !tasks.classList.contains('collapsed');
  tasks.classList.toggle('collapsed', open);
  chev.classList.toggle('open', !open);
}

function spawnConfetti(el, color) {
  const rect = el.getBoundingClientRect();
  const colors = [color, '#ffffff', '#ffd700', '#ff69b4', color];
  for (let i = 0; i < 18; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left: ${rect.left + Math.random() * rect.width}px;
      top: ${rect.top + window.scrollY}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 0.3}s;
      animation-duration: ${0.8 + Math.random() * 0.6}s;
      width: ${4 + Math.random() * 6}px;
      height: ${4 + Math.random() * 6}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1500);
  }
}

function resetAll() {
  if (!confirm('¿Reiniciar todo el progreso?')) return;
  PHASES.forEach(p => { state[p.id] = new Array(p.tasks.length).fill(false); });
  saveState(state);
  document.querySelectorAll('.task.done').forEach(t => t.classList.remove('done'));
  PHASES.forEach(p => { updatePhase(p.id); });
  updateGlobal();
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  PHASES.forEach((p, pi) => {
    const done = phaseDone(p.id);
    const total = p.tasks.length;
    const pct = Math.round(done / total * 100);

    const phase = document.createElement('div');
    phase.className = 'phase' + (done === total ? ' complete' : '');
    phase.id = 'phase-' + p.id;

    phase.innerHTML = `
      <div class="phase-header" onclick="togglePhase('${p.id}')">
        <span class="phase-num">0${pi+1}</span>
        <span class="phase-dot" style="background:${p.color}"></span>
        <div class="phase-title-wrap">
          <div class="phase-name">${p.name}</div>
          <div class="phase-meta">${p.meta}</div>
        </div>
        <div class="phase-right">
          <span class="phase-count" id="count-${p.id}">${done}/${total}</span>
          <span class="phase-chevron open" id="chev-${p.id}">▼</span>
        </div>
      </div>
      <div class="phase-bar">
        <div class="phase-bar-fill" id="bar-${p.id}" style="width:${pct}%;background:${p.color}"></div>
      </div>
      <div class="tasks" id="tasks-${p.id}">
        ${p.tasks.map((t,ti) => `
          <div class="task${state[p.id][ti] ? ' done' : ''}" id="task-${p.id}-${ti}" onclick="toggleTask('${p.id}',${ti})">
            <div class="cb">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M1.5 5L4 7.5L8.5 2.5" stroke="#0e0e0f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="task-body">
              <div class="task-text">${t.text}</div>
              <div class="task-day">${t.day}</div>
            </div>
            <div class="done-badge">hecho</div>
          </div>
        `).join('')}
      </div>
    `;
    main.appendChild(phase);
  });

  updateGlobal();
}

render();
</script>
</body>
</html>
